<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zagadki — odkryj link</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#f97316;--muted:#94a3b8;--glass:rgba(255,255,255,0.03)}
    *{box-sizing:border-box}
    body{font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:0; min-height:100vh; background:linear-gradient(180deg,#071023 0%, #07182b 60%); color:#e6eef8; display:flex; align-items:center; justify-content:center; padding:40px}
    .wrap{width:100%;max-width:980px}
    header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
    h1{font-size:20px;margin:0}
    p.lead{margin:0;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr;gap:18px}
    @media (max-width:880px){.grid{grid-template-columns:1fr}}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); padding:20px;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03)}
    .card h2{margin:0 0 8px 0;font-size:16px}
    .hint{color:var(--muted);font-size:13px;margin-bottom:12px}
    .choices{display:flex;flex-direction:column;gap:8px}
    .choice{display:block;background:var(--glass);padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);cursor:pointer}
    .choice input{display:none}
    .choice span{display:inline-block}
    .choice:hover{transform:translateY(-2px)}
    .reveal{margin-top:12px;padding:12px;border-radius:8px;background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.012));border:1px solid rgba(255,255,255,0.02);display:none}
    input[type="radio"]:checked + label + .reveal{display:block}
    .btn{display:inline-block;padding:10px 14px;border-radius:8px;background:linear-gradient(90deg,var(--accent),#ff8f43);color:#071021;text-decoration:none;font-weight:700}
    footer{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}
    .rebus{font-weight:700;font-size:22px;letter-spacing:1px;margin:12px 0}
    .small{font-size:13px;color:var(--muted)}
    .hidden{display:none}
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>Zagadki — odkryj link</h1>
      <p class="lead">Każda zagadka po poprawnym rozwiązaniu odsłania kolejną.</p>
    </div>
  </header>

  <section class="grid">
   <!-- PUZZLE 1 -->
<article class="card" id="puzzle1">
  <h2>1. Pytanie</h2>
  <p class="hint">Najlepszy przyjaciel to:</p>
  <input type="text" id="friendAnswer" placeholder="Wpisz odpowiedź" style="width:100%;padding:10px;border-radius:8px;border:none;margin-top:10px;">
  <button class="btn" onclick="nextPuzzleText()" style="margin-top:10px;">Sprawdź</button>
  <p id="friendMsg" class="small" style="color:#6aff7a;margin-top:8px;"></p>
</article>


    <!-- PUZZLE 2 -->
<article class="card hidden" id="puzzle2">
  <h2>2. Rozpoznaj piosenkę</h2>
  <p class="hint">Odsłuchaj piosenkę i wpisz tytuł: "zajaweczka".</p>
  <div style="margin:10px 0;">
    <audio controls autoplay>
      <source src="zajaweczka.mp3" type="audio/mpeg">
      Twoja przeglądarka nie wspiera odtwarzania audio.
    </audio>
  </div>
  <input type="text" id="songTitle" placeholder="Wpisz tytuł piosenki" style="width:100%;padding:10px;border-radius:8px;border:none;margin-top:10px;">
  <button class="btn" onclick="checkSongTitle()" style="margin-top:10px;">Sprawdź</button>
  <p id="songMsg" class="small" style="color:#ff6a6a;margin-top:8px;"></p>
</article>


    <!-- PUZZLE 3 -->
<article class="card hidden" id="puzzle3">
  <h2>3. Pytanie</h2>
  <p class="hint">Najlepsza marka samochodu?</p>
  <div class="choices">
    <input type="radio" id="c3a" name="car">
    <label class="choice" for="c3a" onclick="finishCar('Audi')">Audi</label>

    <input type="radio" id="c3b" name="car">
    <label class="choice" for="c3b" onclick="finishCar('BMW')">BMW</label>

    <input type="radio" id="c3c" name="car">
    <label class="choice" for="c3c" onclick="finishCar('Mercedes')">Mercedes</label>
  </div>
  <p id="carMsg" class="small" style="color:#ff6a6a;margin-top:8px;"></p>
</article>
  </section>

  <footer>
    <p class="small">Każda poprawna odpowiedź odsłania kolejną zagadkę.</p>
  </footer>
</main>

<script>
function nextPuzzle(num) {
  if(num === 2) {
    document.getElementById('puzzle1').classList.add('hidden');
    document.getElementById('puzzle2').classList.remove('hidden');
  }
}

function checkSongTitle() {
  const input = document.getElementById('songTitle').value.trim().toLowerCase();
  if(input === 'zajaweczka'){
    document.getElementById('songMsg').style.color = '#6aff7a';
    document.getElementById('songMsg').textContent = 'Dobrze! Przechodzisz dalej!';
    document.getElementById('puzzle2').classList.add('hidden');
    document.getElementById('puzzle3').classList.remove('hidden');
  } else {
    document.getElementById('songMsg').style.color = '#ff6a6a';
    document.getElementById('songMsg').textContent = 'Niepoprawny tytuł — spróbuj ponownie.';
  }
}

function finish() {
  window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
}

function nextPuzzleText() {
  const input = document.getElementById('friendAnswer').value.trim();
  // Każda odpowiedź jest dobra
  document.getElementById('friendMsg').textContent = 'Super! Następna zagadka się pojawia.';
  document.getElementById('puzzle1').classList.add('hidden');
  document.getElementById('puzzle2').classList.remove('hidden');
}
function finishCar(choice) {
  if(choice === 'Audi') {
    // Poprawna odpowiedź
    window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
  } else {
    // Niepoprawna odpowiedź
    document.getElementById('carMsg').textContent = 'Niepoprawna odpowiedź — spróbuj ponownie.';
  }
}

</script>
</body>
</html>
